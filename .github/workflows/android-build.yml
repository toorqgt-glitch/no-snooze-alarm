name: Build No Snooze Alarm APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'NoSnoozeAlarm-Android-Project-with-Cloud-Build.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f NoSnoozeAlarm-Android-Project-with-Cloud-Build.zip
          mkdir android-project
          unzip -q NoSnoozeAlarm-Android-Project-with-Cloud-Build.zip -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoSnoozeAlarm-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
