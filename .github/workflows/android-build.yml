name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack project
        run: unzip -q app-source.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/NoSnoozeAlarm
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoSnoozeAlarm-apk
          path: build-src/NoSnoozeAlarm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
